services:
  - type: web
    name: resume-ai-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
    buildpack:
      - https://github.com/nicholasgasior/heroku-buildpack-google-chrome
